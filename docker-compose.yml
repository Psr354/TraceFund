services:
  tracefund:
    build: .
    container_name: tracefund-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./tracefund-user-1.db:/app/tracefund-user-1.db
      - ./tracefund-user-2.db:/app/tracefund-user-2.db
      - ./backups:/app/backups
    network_mode: default
